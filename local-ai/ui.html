<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ローカルAI</title>
<style>
  :root{--bg:#fff;--fg:#1a1a1a;--user:#e8f0fe;--ai:#f3f3f3;--bd:#ddd}
  @media (prefers-color-scheme:dark){:root{--bg:#161616;--fg:#eee;--user:#1f2d4a;--ai:#262626;--bd:#333}}
  body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.6 system-ui,sans-serif;display:flex;flex-direction:column;height:100vh}
  header{padding:8px 16px;border-bottom:1px solid var(--bd);display:flex;gap:8px;align-items:center}
  header b{flex:1}
  #log{flex:1;overflow:auto;padding:16px;display:flex;flex-direction:column;gap:12px}
  .m{padding:10px 14px;border-radius:12px;max-width:85%;white-space:pre-wrap;word-break:break-word}
  .user{background:var(--user);align-self:flex-end}.assistant{background:var(--ai);align-self:flex-start}
  form{display:flex;gap:8px;padding:12px 16px;border-top:1px solid var(--bd)}
  textarea{flex:1;resize:none;padding:8px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--fg);font:inherit}
  button{padding:8px 16px;border:1px solid var(--bd);border-radius:8px;background:var(--ai);color:var(--fg);cursor:pointer}
</style>
</head>
<body>
<header><b>ローカルAI <small id="model"></small></b><button id="stop" type="button" hidden>停止</button><button id="reset" type="button">履歴消去</button></header>
<div id="log"></div>
<form id="f"><textarea id="t" rows="2" placeholder="メッセージ (Enterで送信 / Shift+Enterで改行)"></textarea><button>送信</button></form>
<script>
const log = document.getElementById('log'), t = document.getElementById('t');
const stopBtn = document.getElementById('stop');
let history = [], model = '', ctrl = null;

fetch('/api/config').then(r => r.json()).then(c => { model = c.model; document.getElementById('model').textContent = model; });

function add(role, text) {
  const d = document.createElement('div');
  d.className = 'm ' + role; d.textContent = text;
  log.appendChild(d); log.scrollTop = log.scrollHeight;
  return d;
}

async function send(text) {
  history.push({role: 'user', content: text});
  add('user', text);
  const box = add('assistant', '…');
  let reply = '';
  ctrl = new AbortController(); stopBtn.hidden = false;
  try {
    const res = await fetch('/api/chat', {method: 'POST', signal: ctrl.signal,
      body: JSON.stringify({model, messages: history, stream: true, keep_alive: '30m'})});
    if (!res.ok) throw new Error(await res.text());
    const reader = res.body.getReader(), dec = new TextDecoder();
    let buf = '';
    for (;;) {
      const {done, value} = await reader.read();
      if (done) break;
      buf += dec.decode(value, {stream: true});
      const lines = buf.split('\n'); buf = lines.pop();
      for (const l of lines) {
        if (!l.trim()) continue;
        const j = JSON.parse(l);
        if (j.error) throw new Error(j.error);
        reply += j.message?.content || '';
        box.textContent = reply; log.scrollTop = log.scrollHeight;
      }
    }
    history.push({role: 'assistant', content: reply});
  } catch (e) {
    if (e.name === 'AbortError') history.push({role: 'assistant', content: reply});
    else { box.textContent = '[エラー] ' + e.message; history.pop(); }
  } finally { ctrl = null; stopBtn.hidden = true; }
}

document.getElementById('f').onsubmit = e => {
  e.preventDefault();
  const v = t.value.trim();
  if (!v || ctrl) return;
  t.value = ''; send(v);
};
t.onkeydown = e => { if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); document.getElementById('f').requestSubmit(); } };
stopBtn.onclick = () => ctrl && ctrl.abort();
document.getElementById('reset').onclick = () => { history = []; log.innerHTML = ''; };
</script>
</body>
</html>
