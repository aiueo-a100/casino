<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0A4530">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>整理券 | 1-E CASINO</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Zen+Kaku+Gothic+New:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --felt:#0A4530;--felt9:#062B1D;--felt8:#0A3626;--felt5:#0F6144;
  --paper:#F6F1E1;--paper2:#E7DFC8;--ink:#0B2E1E;--inks:#5A6B60;
  --brass:#B98A2A;--amber:#FFC300;--red:#C4392C;--go:#1E8A5A;
  --txt:#EDE7D6;--txts:#9DB8A8;
  --jp:"Zen Kaku Gothic New",system-ui,-apple-system,sans-serif;
  --num:"Archivo Black",system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--felt);min-height:100%}
body{font-family:var(--jp);font-weight:500;color:var(--txt);line-height:1.8;
  padding:calc(14px + env(safe-area-inset-top)) 13px calc(24px + env(safe-area-inset-bottom));
  overflow-x:hidden;-webkit-text-size-adjust:100%}
.wrap{max-width:460px;margin:0 auto}
button{font-family:var(--jp);font-weight:900;border:none;cursor:pointer}

/* 上のバー */
.bar{display:flex;justify-content:space-between;align-items:center;font-size:11px;color:#9DD3B4;
  border-bottom:1px solid rgba(246,241,225,.2);padding-bottom:9px}
.bar b{color:var(--brass);letter-spacing:.14em;font-size:11px}
.bar .back{color:#9DD3B4;font-size:12px;background:none;padding:0}

/* お知らせ */
.announce{background:var(--amber);color:#160E00;border-radius:10px;padding:10px 12px;margin-top:11px;
  display:flex;gap:8px;align-items:flex-start}
.announce .ic{font-size:14px;flex-shrink:0}
.announce .tx{font-size:12.5px;font-weight:900;line-height:1.55}

/* ホーム */
.home{text-align:center;padding:36px 4px 0}
.home .suit{font-size:26px;letter-spacing:.16em;color:var(--brass)}
.home h1{font-size:36px;font-weight:900;letter-spacing:.04em;margin-top:12px}
.home .en{font-size:11px;letter-spacing:.36em;color:var(--txts);margin-top:8px}
.now{background:var(--paper);color:var(--ink);border-radius:11px;padding:14px;margin:26px 0}
.now .k{font-size:10px;letter-spacing:.2em;color:var(--brass);font-weight:900}
.now .n{font-family:var(--num);font-size:44px;line-height:1.05;font-variant-numeric:tabular-nums}
.now .b{font-size:12px;color:var(--inks)}
.now .none{font-size:14px;font-weight:900;color:var(--inks);padding:10px 0}
.gold{width:100%;background:var(--brass);color:#1A1206;border-radius:11px;padding:15px 0;font-size:15px}
.ghost{width:100%;background:transparent;border:1.5px solid rgba(246,241,225,.35);color:var(--txt);
  border-radius:11px;padding:13px 0;font-size:14px;font-weight:700;margin-top:9px}

/* ブース選択 */
.ttl{font-size:17px;font-weight:900;margin-top:14px}
.sb{font-size:11px;color:#9DD3B4;margin:2px 0 12px}
.brow{background:var(--paper);color:var(--ink);border-radius:10px;margin-bottom:8px;overflow:hidden}
.brline{display:flex;align-items:center;gap:8px;padding-right:10px}
.bmain{display:flex;align-items:center;gap:8px;padding:11px 10px;flex:1;min-width:0;background:none;text-align:left}
.bmain .m{flex:1;min-width:0;line-height:1.35}
.bmain .m b{display:block;font-size:15px;font-weight:900;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bmain .m span{font-size:10.5px;color:var(--inks);font-weight:500}
.bmain .w2{text-align:center;flex-shrink:0;white-space:nowrap}
.bmain .w2 i{display:block;font-family:var(--num);font-size:24px;color:var(--felt5);font-style:normal;line-height:1}
.bmain .w2 em{display:block;font-size:9px;color:var(--inks);font-style:normal;margin-top:2px}
.sbtn{background:var(--paper2);border:1px solid rgba(11,46,30,.16);border-radius:8px;padding:7px 7px;
  text-align:center;flex-shrink:0;line-height:1.25;white-space:nowrap}
.sbtn .s{font-size:10px;color:var(--brass);font-weight:900}
.sbtn .v{font-size:13px;font-weight:900;color:var(--ink)}
.sbtn .k{font-size:8px;color:var(--inks);font-weight:500}
.sbtn.dim{opacity:.35}
.seat{padding:0 10px 9px;margin-top:-2px}
.seat .g{height:6px;background:var(--paper2);border-radius:4px;overflow:hidden}
.seat .g i{display:block;height:100%;background:var(--go);border-radius:4px}
.seat .g i.full{background:var(--red)}
.seat .sl{display:flex;justify-content:space-between;font-size:9px;color:var(--inks);margin-top:3px;font-weight:700}
.brow.stop{opacity:.55}
.brow.got .bmain{opacity:.75}

/* 券 */
.tk{background:var(--paper);border-radius:12px;margin-top:14px;position:relative}
.tk .tp{padding:18px 14px 14px;text-align:center;color:var(--ink)}
.tk .bo{font-size:17px;font-weight:900}
.tk .nu{font-family:var(--num);font-size:74px;line-height:.95;font-variant-numeric:tabular-nums;margin:8px 0 3px}
.tk .pe{font-size:11.5px;color:var(--inks)}
.tk .stt{margin-top:12px;background:var(--felt);border-radius:9px;padding:10px}
.tk .stt .k{font-size:9.5px;letter-spacing:.14em;color:#9DD3B4;font-weight:900}
.tk .stt .v{font-size:22px;font-weight:900;color:var(--paper)}
.tk .stt .v small{font-size:11px;color:#9DD3B4;margin-left:5px}
.pf{position:relative;height:0;border-top:2px dashed rgba(11,46,30,.32);margin:0 12px}
.pf::before,.pf::after{content:"";position:absolute;top:-11px;width:21px;height:21px;border-radius:50%;background:var(--felt)}
.pf::before{left:-23px}.pf::after{right:-23px}
.tk .bt{padding:12px 14px 14px;text-align:center}
.tk .hint{font-size:11px;color:var(--inks);line-height:1.65}
.cancel{width:100%;margin-top:10px;background:transparent;border:2px solid rgba(196,57,44,.45);
  color:var(--red);border-radius:9px;padding:9px 0;font-size:12px}
.fn{text-align:center;font-size:10px;color:#7FA48F;margin-top:10px}

/* 終了・無効 */
.doneno{font-family:var(--num);font-size:60px;line-height:.95;color:#A9B4AC;margin:6px 0 2px;font-variant-numeric:tabular-nums}
.doneno.bad{color:var(--red)}
.donemsg{font-size:16px;font-weight:900;color:var(--ink);margin-top:4px}
.donemsg.bad{color:var(--red)}
.donestt{font-size:11px;color:var(--inks);margin-top:2px}
.revbtn{width:100%;background:var(--brass);color:#1A1206;border-radius:10px;padding:13px 0;font-size:14px}

/* 人数シート */
.dim{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:20}
.sheet{position:fixed;left:12px;right:12px;bottom:calc(14px + env(safe-area-inset-bottom));
  background:var(--paper);color:var(--ink);border-radius:14px;padding:16px 15px;text-align:center;z-index:21;
  max-width:436px;margin:0 auto}
.sheet .bn{font-size:16px;font-weight:900}
.sheet .q{font-size:11.5px;color:var(--inks);margin-bottom:13px}
.psel{display:flex;gap:7px}
.psel button{flex:1;background:var(--paper2);border:2px solid transparent;border-radius:11px;padding:14px 0;
  font-family:var(--num);font-size:22px;color:var(--ink)}
.psel button.on{background:var(--felt5);border-color:var(--ink);color:#fff}
.sheet .go{width:100%;background:var(--brass);color:#1A1206;border-radius:11px;padding:14px 0;font-size:15px;margin-top:13px}
.sheet .cx{width:100%;background:none;color:var(--inks);font-size:12px;font-weight:700;padding:9px 0}
.pnote{font-size:9.5px;color:var(--inks);line-height:1.55;margin-top:9px}

/* 呼び出し */
#callscr{position:fixed;inset:0;background:var(--amber);z-index:50;display:none;flex-direction:column;text-align:center}
#callscr.on{display:flex}
.stripe{height:15px;flex-shrink:0;
  background:repeating-linear-gradient(-45deg,#160E00 0 12px,var(--amber) 12px 24px)}
#callscr .in{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:18px}
#callscr .yt{font-size:11px;letter-spacing:.4em;font-weight:900;color:#160E00}
#callscr .yb{font-size:26px;font-weight:900;color:#160E00;margin-top:2px}
.plate{background:var(--paper);border:3px solid #160E00;border-radius:16px;width:240px;padding:14px 12px 16px;
  margin-top:16px;position:relative;box-shadow:7px 7px 0 rgba(22,14,0,.28)}
.plate .nt{position:absolute;top:50%;margin-top:-11px;width:22px;height:22px;border-radius:50%;
  background:var(--amber);border:3px solid #160E00}
.plate .nt.l{left:-13px}.plate .nt.r{right:-13px}
.plate .rib{background:#160E00;color:var(--amber);border-radius:7px;display:inline-block;padding:4px 16px;
  font-size:12.5px;font-weight:900}
.plate .nu{font-family:var(--num);font-size:96px;color:#160E00;line-height:1;margin-top:8px;font-variant-numeric:tabular-nums}
.plate .su{font-size:12px;color:var(--brass);letter-spacing:.5em;margin-top:6px}
#callscr .go2{font-size:19px;font-weight:900;color:#160E00;margin-top:16px}
#callscr .ok{background:#160E00;color:var(--amber);border-radius:12px;padding:13px 34px;font-size:15px;margin-top:18px}

/* レビュー */
.rv{text-align:center}
.rv .bo2{font-size:18px;font-weight:900;margin-top:10px}
.rv .q2{font-size:12px;color:#9DD3B4;margin-bottom:12px}
.stars{font-size:32px;letter-spacing:.08em;background:none;padding:0}
.stars span{cursor:pointer;opacity:.28}
.stars span.on{opacity:1}
.rvlb{font-size:14px;font-weight:900;color:var(--amber);margin:6px 0 12px;min-height:22px}
textarea{width:100%;background:var(--paper);color:var(--ink);border:none;border-radius:11px;padding:12px;
  font-family:var(--jp);font-size:13px;height:74px;resize:none}
.cnt{font-size:10px;color:#7FA48F;text-align:right;margin-top:4px}
.send{width:100%;background:var(--brass);color:#1A1206;border-radius:11px;padding:13px 0;font-size:15px;margin-top:10px}
.send:disabled{background:#123C2A;color:#6E8C7C}

/* 口コミ */
.rhead{background:var(--paper);color:var(--ink);border-radius:12px;padding:13px;text-align:center;margin-top:11px}
.rhead .av{font-family:var(--num);font-size:38px;line-height:1.05}
.rhead .st{font-size:14px;color:var(--brass);letter-spacing:.06em}
.rhead .ct{font-size:11px;color:var(--inks);margin-top:2px}
.ci{background:rgba(246,241,225,.08);border-radius:10px;padding:10px 12px;margin-top:7px;text-align:left}
.ci .s{font-size:11px;color:var(--brass)}
.ci .t{font-size:12.5px;color:var(--txt);line-height:1.65;margin-top:3px;word-break:break-word}
.empty{text-align:center;font-size:12px;color:var(--txts);padding:26px 0}


/* ===== スタッフ ===== */
.staff{background:var(--felt9);margin:-14px -13px -24px;min-height:100vh;
  padding:calc(14px + env(safe-area-inset-top)) 13px calc(24px + env(safe-area-inset-bottom))}
.shd{display:flex;justify-content:space-between;align-items:center;font-size:11.5px;color:var(--txts);
  border-bottom:1px solid rgba(185,138,42,.4);padding-bottom:9px;margin-bottom:14px}
.shd .sw{border:1px solid rgba(246,241,225,.26);border-radius:6px;padding:3px 9px;font-size:10.5px;
  background:none;color:var(--txts);font-weight:700}
.sjob{font-size:23px;font-weight:900;color:var(--paper);line-height:1.3}
.ssub{font-size:11.5px;color:var(--txts);margin-top:2px;margin-bottom:14px}

/* 担当選択 */
.rb{width:100%;background:var(--paper);color:var(--ink);border-radius:11px;padding:15px;margin-bottom:9px;
  text-align:left;display:block}
.rb b{display:block;font-size:16px;font-weight:900}
.rb span{font-size:11.5px;color:var(--inks);font-weight:500}
.rb.main{background:var(--brass);color:#1A1206}
.rb.main span{color:rgba(26,18,6,.72)}

/* 認証 */
.pw{background:var(--paper);color:var(--ink);border:none;border-radius:11px;padding:14px;width:100%;
  font-size:20px;text-align:center;font-family:var(--num);letter-spacing:.3em}

/* 受付 */
.rrow{display:flex;align-items:center;gap:9px;border-radius:10px;padding:11px;margin-bottom:8px;
  background:var(--paper);color:var(--ink);width:100%;text-align:left}
.rrow .lamp{width:9px;height:9px;border-radius:50%;flex-shrink:0;background:var(--go)}
.rrow .rm{flex:1;min-width:0;line-height:1.4;overflow:hidden}
.rrow .rm b{display:block;font-size:14px;font-weight:900;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rrow .rm span{font-size:10.5px;color:var(--inks);font-weight:500}
.rrow .rbtn{background:var(--brass);color:#1A1206;border-radius:8px;padding:10px 12px;
  font-family:var(--num);font-size:18px;flex-shrink:0}
.rrow.busy{background:rgba(246,241,225,.09);color:var(--txt)}
.rrow.busy .lamp{background:#5E7A6B}
.rrow.busy .rm b{color:var(--txt)}
.rrow.busy .rm span{color:var(--txts)}
.rrow .rlock{background:#123C2A;color:#6E8C7C;border-radius:8px;padding:9px 12px;font-size:11px;
  font-weight:700;flex-shrink:0}
.rrow.none{background:rgba(246,241,225,.05)}
.rrow.none .lamp{background:#3E5A4B}
.rrow.none .rm b{color:var(--txts)}
.rrow.none .rm span{color:#6E8C7C}
.callnow{background:var(--amber);color:#160E00;border-radius:12px;padding:15px 13px;text-align:center;margin-bottom:10px}
.callnow .cnb{font-size:12.5px;font-weight:900}
.callnow .cnn{font-family:var(--num);font-size:54px;line-height:1;margin:3px 0;font-variant-numeric:tabular-nums}
.callnow .cnp{font-size:11px;font-weight:700}
.callnow .cnt2{font-family:var(--num);font-size:13px;margin-top:5px}
.cnrow{display:flex;gap:7px;margin-top:11px}
.cnrow button{flex:1;border-radius:9px;padding:12px 0;font-size:14px}
.cy{background:#160E00;color:var(--amber)}
.cn{background:rgba(22,14,0,.16);color:#160E00}
.callsp{width:100%;background:var(--felt8);border:1.5px solid var(--brass);color:var(--brass);
  border-radius:9px;padding:11px 0;font-size:12.5px;margin-top:4px}
.rlg{font-size:10.5px;color:#7FA48F;line-height:1.7;border-top:1px solid rgba(246,241,225,.13);
  padding-top:10px;margin-top:14px}

/* 卓 */
.ctr{text-align:center;margin-top:24px}
.ctr .nu2{font-family:var(--num);font-size:84px;line-height:.95;color:var(--paper);font-variant-numeric:tabular-nums}
.ctr .me{font-size:12px;color:var(--txts);margin-top:3px}
.ctr .el{font-family:var(--num);font-size:16px;color:var(--go);margin-top:8px}
.ctr .el.hot{color:var(--amber)}
.ctr .el.over{color:var(--red)}
.bigbtn{width:100%;background:var(--go);color:#fff;border-radius:12px;padding:17px 0;font-size:18px;margin-top:24px}
.nx{text-align:center;font-size:11.5px;color:var(--txts);margin-top:12px}
.trow{background:var(--paper);color:var(--ink);border-radius:10px;padding:11px;margin-bottom:8px;
  display:flex;align-items:center;gap:10px}
.trow .tn{font-family:var(--num);font-size:26px;line-height:1;flex-shrink:0;font-variant-numeric:tabular-nums}
.trow .tm{flex:1;min-width:0;line-height:1.4;overflow:hidden}
.trow .tp2{font-size:10.5px;color:var(--inks)}
.trow .tt{font-family:var(--num);font-size:12.5px;color:var(--felt5)}
.trow .tt.hot{color:#9A6A00}
.trow .tt.over{color:var(--red)}
.trow .tb{background:var(--felt5);color:#fff;border-radius:7px;padding:9px 12px;font-size:12px;flex-shrink:0}

/* 交換所 */
.krest{text-align:center;margin-top:18px}
.krest .kk{font-size:10.5px;letter-spacing:.16em;color:var(--brass);font-weight:900}
.krest .kn{font-family:var(--num);font-size:68px;line-height:.95;color:var(--paper);font-variant-numeric:tabular-nums}
.krest .kn.zero{color:var(--red)}
.krest .ku{font-size:11.5px;color:var(--txts)}
.kbar{height:7px;background:rgba(246,241,225,.15);border-radius:4px;margin:11px 4px 0;overflow:hidden}
.kbar i{display:block;height:100%;background:linear-gradient(90deg,var(--brass),var(--amber))}
.kcnt{display:flex;align-items:center;gap:9px;margin-top:16px;background:var(--paper);border-radius:12px;padding:11px}
.kcnt button{width:54px;height:54px;border-radius:11px;background:var(--paper2);color:var(--ink);
  font-family:var(--num);font-size:26px;flex-shrink:0}
.kcnt button:disabled{opacity:.35}
.kcnt .kv{flex:1;min-width:0;text-align:center;line-height:1}
.kcnt .knum{font-family:var(--num);font-size:40px;color:var(--ink)}
.kcnt .knum.z{color:#B4BDB6}
.kcnt .kv small{display:block;font-size:10.5px;color:var(--inks);font-weight:700;margin-top:3px}
.kbig{width:100%;border-radius:13px;padding:16px 0;font-size:18px;margin-top:16px}
.kbig.on{background:var(--brass);color:#1A1206}
.kbig.off{background:#123C2A;color:#6E8C7C}
.kundo{width:100%;background:transparent;border:1.5px solid rgba(246,241,225,.28);color:var(--txts);
  border-radius:10px;padding:11px 0;font-size:12px;font-weight:700;margin-top:9px}
.zmsg{background:#3A1512;border-left:4px solid var(--red);border-radius:0 9px 9px 0;padding:12px 13px;margin-top:14px}
.zmsg b{display:block;font-size:13px;font-weight:900;color:#FC8181;margin-bottom:3px}
.zmsg span{font-size:11px;color:#F0D0D0;line-height:1.65}


/* ===== 統括 ===== */
.dsec{font-size:10px;letter-spacing:.16em;font-weight:900;color:var(--brass);margin:16px 0 7px;
  border-bottom:1px solid rgba(185,138,42,.3);padding-bottom:4px;display:flex;justify-content:space-between;align-items:baseline}
.dsec u{text-decoration:none;background:var(--red);color:#fff;border-radius:9px;padding:1px 8px;font-size:10px;letter-spacing:0}
.kpr{display:flex;gap:7px}
.kpr>div{flex:1;background:var(--paper);border-radius:10px;padding:9px 3px;text-align:center;min-width:0}
.kpr .a{font-family:var(--num);font-size:22px;color:var(--ink);line-height:1.1;font-variant-numeric:tabular-nums}
.kpr .b2{font-size:9.5px;color:var(--inks);font-weight:700}
.total2{font-size:10.5px;color:var(--txts);text-align:center;margin-top:7px}
.total2 b{color:var(--paper);font-family:var(--num);font-size:12.5px}
.goal{background:var(--paper);color:var(--ink);border-radius:10px;padding:10px 12px;margin-top:7px}
.goal .t{font-size:11.5px;font-weight:900}
.goal .bar2{height:7px;background:var(--paper2);border-radius:4px;margin:7px 0 5px;overflow:hidden}
.goal .bar2 i{display:block;height:100%;background:var(--felt5)}
.goal .f{font-size:10px;color:var(--inks);line-height:1.6}
.tbr{background:var(--paper);color:var(--ink);border-radius:10px;padding:9px 11px;margin-bottom:6px}
.tbr b{font-size:13px;font-weight:900}
.tbr .v{font-size:10.5px;color:var(--inks);margin-top:1px}
.tbr .v em{font-style:normal;font-weight:900;color:var(--felt5)}
.tbr.idle{background:rgba(246,241,225,.09);color:var(--txt)}
.tbr.idle b{color:var(--txt)}.tbr.idle .v{color:var(--txts)}
.tbr.hot{box-shadow:inset 0 0 0 2px var(--red)}
.tbr.hot .v em{color:var(--red)}
.alr{border-radius:10px;padding:11px 12px;margin-bottom:6px}
.alr.bad{background:#3A1512;border-left:4px solid var(--red)}
.alr.wn{background:#3A2400;border-left:4px solid var(--amber)}
.alr b{display:block;font-size:12.5px;font-weight:900;color:var(--paper)}
.alr p{font-size:10.5px;color:#C8BFA8;line-height:1.6;margin-top:2px}
.alr button{background:var(--paper);color:var(--ink);border-radius:7px;padding:6px 12px;font-size:11px;margin-top:7px}

/* ---------- 通信 ---------- */
async function api(path,opt={}){
  const c=new AbortController(); const to=setTimeout(()=>c.abort(),10000);
  try{
    const r=await fetch(`${URL_}/rest/v1/${path}`,{...opt,signal:c.signal,
      headers:{apikey:KEY,Authorization:`Bearer ${KEY}`,"Content-Type":"application/json",...(opt.headers||{})}});
    if(!r.ok){const t=await r.text();const e=new Error(t||r.status);e.status=r.status;throw e;}

    const t=await r.text(); return t?JSON.parse(t):null;
  } finally{ clearTimeout(to); }
}

  reviewed:LS.get("reviewed2",[]),  // [booth_id]

function set(p){Object.assign(S,p); if(p.mine)LS.set("mine2",S.mine); if(p.reviewed)LS.set("reviewed2",S.reviewed); render();}
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function pad(n){return String(n).padStart(3,"0")}
function toast(m){const t=document.getElementById("toast");t.textContent=m;t.classList.add("on");setTimeout(()=>t.classList.remove("on"),2200)}

/* ---------- 読み込み ---------- */
async function refresh(){
  try{
    const isStaff=(S.view==="staff");
    const [b,t,r,st,pl]=await Promise.all([
      db.booths(), db.tickets(!isStaff), db.reviews(), db.settings(),
      isStaff?db.prizeLog():Promise.resolve(S.prizeLog)
    ]);
    S.booths=b||[]; S.tickets=t||[]; S.reviews=r||[]; S.settings=(st&&st[0])||{}; S.prizeLog=pl||[];
    S.now=Date.now();
    S.offline=false;
    // DBに無い券は端末からも消す（前日の券が残るのを防ぐ）
    const ids=new Set(S.tickets.map(x=>x.id));
    const kept=S.mine.filter(m=>ids.has(m.id));
    if(kept.length!==S.mine.length){S.mine=kept;LS.set("mine2",kept)}
    // 呼ばれたか判定
    checkCall();
  }catch(e){ S.offline=true; }
  S.loaded=true; render();
}
function checkCall(){
  for(const m of S.mine){
    const t=S.tickets.find(x=>x.id===m.id);
    if(!t||t.status!=="called")continue;
    if(S.lastCalled===t.id)continue;
    S.lastCalled=t.id;
    const b=S.booths.find(x=>x.id===t.booth);
    showCall(t.number,b?b.name:t.booth);
  }
}
function showCall(num,name){
  document.getElementById("callNum").textContent=pad(num);
  document.getElementById("callBooth").textContent=name;
  document.getElementById("callscr").classList.add("on");
  try{navigator.vibrate&&navigator.vibrate([400,150,400,150,400])}catch(e){}
}
function closeCall(){document.getElementById("callscr").classList.remove("on")}

/* ---------- 集計 ---------- */
function waitGroups(bid){return S.tickets.filter(t=>t.booth===bid&&t.status==="waiting").length}
function inside(bid){return S.tickets.filter(t=>t.booth===bid&&t.status==="inside").reduce((a,t)=>a+(t.people||1),0)}
// 呼んでいる人・到着した人も席を押さえている扱いにする
function reserved(bid){return S.tickets.filter(t=>t.booth===bid&&["called","arrived","inside"].includes(t.status)).reduce((a,t)=>a+(t.people||1),0)}
function myTicket(bid){return S.mine.find(m=>m.booth===bid)}
function ticketOf(m){return S.tickets.find(t=>t.id===m.id)}
function starsOf(bid){
  const rs=S.reviews.filter(r=>r.booth_id===bid);
  if(!rs.length)return null;
  return {avg:(rs.reduce((a,r)=>a+r.rating,0)/rs.length), n:rs.length, list:rs};
}
function prizeToday(){return S.prizeLog.filter(x=>(x.day||1)===today())}
function prizeLeft(){return prizeToday().reduce((a,x)=>a+x.amount,0)}
function prizeGiven(){return prizeToday().filter(x=>x.kind==="give").reduce((a,x)=>a-x.amount,0)}
function prizeTotal(){return prizeToday().filter(x=>x.kind!=="give").reduce((a,x)=>a+x.amount,0)}
function insideTickets(bid){return S.tickets.filter(t=>t.booth===bid&&t.status==="inside").sort((a,b)=>a.number-b.number)}
function waitingTickets(bid){return S.tickets.filter(t=>t.booth===bid&&t.status==="waiting").sort((a,b)=>a.number-b.number)}
function calledTickets(bid){return S.tickets.filter(t=>t.booth===bid&&(t.status==="called"||t.status==="arrived")).sort((a,b)=>a.number-b.number)}
function allCalled(){return S.tickets.filter(t=>t.status==="called"||t.status==="arrived").sort((a,b)=>a.number-b.number)}
function elapsed(iso){
  if(!iso)return null;
  const sec=Math.max(0,Math.floor((S.now-new Date(iso).getTime())/1000));
  return `${Math.floor(sec/60)}:${String(sec%60).padStart(2,"0")}`;
}
function elapsedSec(iso){ return iso? Math.max(0,Math.floor((S.now-new Date(iso).getTime())/1000)) : 0 }
// 待ち時間 = 前に並んでいる組が終わるのにかかる時間
// 席数が少ない卓は、1組でも人数ぶん回転が要る
function waitMinutes(b, tickets){
  const cap=b.capacity||4, turn=b.avg_minutes||6;
  let rounds=0;
  for(const t of tickets) rounds += Math.ceil((t.people||1)/cap);
  return rounds*turn;
}
function aheadOf(m){
  const t=ticketOf(m); if(!t)return 0;
  return S.tickets.filter(x=>x.booth===m.booth&&x.status==="waiting"&&x.number<m.number).length;
}

/* ---------- 操作 ---------- */
function go(v){set({view:v})}
function openPeople(id){set({pickBooth:id,pickPeople:2})}
function closePeople(){set({pickBooth:null})}
function setPeople(n){set({pickPeople:n})}
function seeReviews(id){set({seeBooth:id,view:"reviews"})}
function setRating(n){set({revRating:n})}
function cntUp(){document.getElementById("cnt").textContent=document.getElementById("rvText").value.length}
function openReview(bid){set({revBooth:bid,revRating:0,view:"review"})}
function dropMine(id){set({mine:S.mine.filter(m=>m.id!==id)})}

async function issue(){
  if(S.busy)return;
  if(S.mine.length>=MAX_TICKETS){toast("整理券は1枚までです");return}
  set({busy:true});
  const booth=S.pickBooth, people=S.pickPeople;
  let ok=false;
  for(let i=0;i<5;i++){
    try{
      const res=await db.addTicket(booth,people,S.settings.day||1);
      if(res&&res[0]){
        const t=res[0];
        S.mine.push({id:t.id,number:t.number,booth,people});
        LS.set("mine2",S.mine);
        ok=true; break;
      }
    }catch(e){ await new Promise(r=>setTimeout(r,100+Math.random()*400)); }
  }
  S.busy=false; S.pickBooth=null;
  if(ok){ await refresh(); set({view:"mine",justIssued:true}); toast("整理券を取りました"); setTimeout(()=>{S.justIssued=false;if(S.view==="mine")render()},15000); }
  else { render(); toast("取得できませんでした。もう一度お試しください"); }
}

async function cancelTicket(id){
  if(!confirm("この整理券を取り消しますか？"))return;
  set({busy:true});
  try{ await db.delTicket(id); set({mine:S.mine.filter(m=>m.id!==id)}); toast("取り消しました"); }
  catch(e){ toast("取り消せませんでした"); }
  S.busy=false; await refresh();
  if(!S.mine.length)set({view:"home"});
}

async function sendReview(){
  if(!S.revRating||S.busy)return;
  const last=LS.get("lastrev",0);
  if(Date.now()-last<30000){ toast("すこし時間をあけてください"); return }
  set({busy:true});
  const txt=(document.getElementById("rvText")||{}).value||"";
  try{
    await db.addReview(S.revBooth,S.revRating,txt.slice(0,100)||null);
    S.reviewed.push(S.revBooth); LS.set("reviewed2",S.reviewed); LS.set("lastrev",Date.now());
    toast("ありがとうございました");
    S.busy=false; await refresh(); set({view:"mine"});
  }catch(e){ S.busy=false; toast("送信できませんでした"); render(); }
}

function renderReception(){
  const called=allCalled();
  let h=`<div class="staff">
    <div class="shd"><span>受付</span><button class="sw" onclick="setRole(null)">担当を変更</button></div>`;

  if(called.length){
    h+=`<div class="sjob">到着待ち</div><div class="ssub">来たら「到着」、来なければ「不在」</div>`;
    for(const t of called){
      const b=S.booths.find(x=>x.id===t.booth);
      const sec=elapsedSec(t.called_at);
      const over=sec>300;               // 5分で期限切れ
      h+=`<div class="callnow" ${over?'style="opacity:.7"':""}>
        <div class="cnb">${esc(b?b.name:t.booth)}${t.status==="arrived"?" ・ 到着済み":""}</div>
        <div class="cnn">${pad(t.number)}</div>
        <div class="cnp">${t.people}人で参加</div>
        <div class="cnt2" ${sec>120?'style="color:#8a1f14"':""}>呼び出しから ${elapsed(t.called_at)||"0:00"}${over?" ・ 期限切れ":""}</div>
        <div class="cnrow">
          ${t.status==="called"?`<button class="cy" onclick="arrive(${t.id})">到着</button>`:`<button class="cy" style="opacity:.5" disabled>到着済み</button>`}
          <button class="cn" onclick="absent(${t.id})">不在</button>
        </div>
      </div>`;
    }
  } else {
    h+=`<div class="sjob">番号を呼ぶ</div><div class="ssub">もうすぐ終わりそうなら先に呼べます</div>`;
  }

  for(const b of S.booths){
    const cap=b.capacity||4;
    const res=reserved(b.id);          // 座っている＋呼んでいる人数
    const wait=waitingTickets(b.id);
    const full=res>=cap;
    const paused=b.paused;
    const ins=insideTickets(b.id);
    let cls="rrow", right="", sub="";
    if(paused){ cls+=" none"; right=`<span class="rlock">停止中</span>`; sub="受付を止めています"; }
    else if(!wait.length){ cls+=" none"; right=`<span class="rlock">―</span>`; sub="待機なし"; }
    else if(full){ cls+=" busy"; right=`<span class="rbtn">${pad(wait[0].number)}</span>`;
      const el=ins.length?elapsed(ins[0].inside_at):"";
      sub=`${res}/${cap}人 使用中${el?" ・ "+el:""} ・ ${wait.length}組待ち`; }

async function callNext(bid){
  if(S.busy)return;
  const wait=waitingTickets(bid);
  if(!wait.length){toast("待っている人がいません");return}
  const b0=S.booths.find(x=>x.id===bid);
  const cap=b0.capacity||4;
  if(reserved(bid)>=cap){
    const ins=insideTickets(bid);
    const el=ins.length?(elapsed(ins[0].inside_at)||"—"):"—";
    if(!confirm(`${b0.name}はまだ満席です（${el}）。\n先に呼んでおきますか？`))return;
  }
  set({busy:true});
  try{
    await db.upTicket(wait[0].id,{status:"called",called_at:new Date().toISOString()});
    await refresh(); toast(pad(wait[0].number)+"番を呼びました");
  }catch(e){ toast("呼び出せませんでした") }
  S.busy=false; render();
}

async function callByNumber(){
  if(S.busy)return;
  const v=prompt("呼ぶ番号を入れてください");
  if(!v)return;
  const n=parseInt(v,10);
  const t=S.tickets.find(x=>x.number===n&&x.status==="waiting");
  if(!t){toast("その番号は待機中ではありません");return}
  set({busy:true});
  try{
    await db.upTicket(t.id,{status:"called",called_at:new Date().toISOString()});
    await refresh(); toast(pad(n)+"番を呼びました");
  }catch(e){ toast("呼び出せませんでした") }
  S.busy=false; render();
}

async function arrive(id){
  if(S.busy)return;
  set({busy:true});
  try{
    const t=S.tickets.find(x=>x.id===id);
    const now=new Date().toISOString();
    // 席が空いていればそのまま座らせる
    const b=S.booths.find(x=>x.id===t.booth);
    const room=(b.capacity||4)-inside(t.booth);
    if(room>=(t.people||1)){
      await db.upTicket(id,{status:"inside",arrived_at:now,inside_at:now});
      toast("入場しました");
    }else{
      await db.upTicket(id,{status:"arrived",arrived_at:now});
      toast("到着を記録しました（席が空いたら卓が座らせます）");
    }
    await refresh();
  }catch(e){ toast("できませんでした") }
  S.busy=false; render();
}

async function seat(id){
  if(S.busy)return;
  set({busy:true});
  try{
    await db.upTicket(id,{status:"inside",inside_at:new Date().toISOString()});
    await refresh(); toast("開始しました");

async function absent(id){

  if(!confirm("この番号の人を不在にしますか？（整理券は無効になります）"))return;
  set({busy:true});

async function finish(ids){

  S.busy=false; render();

/* ---------- 統括 ---------- */
function parseHM(v){ if(!v)return null; const m=String(v).match(/^(\d{1,2}):(\d{2})$/); if(!m)return null;
  const d=new Date(); d.setHours(+m[1],+m[2],0,0); return d; }
function today(){ return S.settings.day||1 }
function doneTickets(){ return S.tickets.filter(t=>t.status==="done") }
// 「今日」は日付ではなく営業日（day=1:金曜 / 2:土曜）で切る
// 日付で切ると時差で金土が混ざる
function todayDone(){ return doneTickets().filter(t=>(t.day||1)===today()) }
function people(list){ return list.reduce((a,t)=>a+(t.people||1),0) }
function perHour(){
  const now=Date.now(), ago=now-3600000;
  const n=todayDone().filter(t=>t.done_at&&new Date(t.done_at).getTime()>=ago);
  const op=parseHM(S.settings.open_at);
  if(op && now-op.getTime()<1800000) return null;   // 開場30分は計測中
  return people(n);
}
function forecast(){
  const ph=perHour(); const cl=parseHM(S.settings.close_at);
  if(ph===null||!cl) return null;
  const restH=Math.max(0,(cl.getTime()-Date.now())/3600000);
  return Math.round(people(todayDone())+ph*restH);
}
function prizeOutAt(){
  const left=prizeLeft(); if(left<=0) return null;
  const op=parseHM(S.settings.open_at); if(!op) return null;
  const el=(Date.now()-op.getTime())/3600000; if(el<0.5) return null;
  const rate=prizeGiven()/el; if(rate<=0) return null;
  const t=new Date(Date.now()+left/rate*3600000);
  return `${t.getHours()}:${String(t.getMinutes()).padStart(2,"0")}`;
}

function renderAdmin(){
  if(S.sub==="settings") return renderSettings();
  if(S.sub==="announce") return renderAnnounce();
  if(S.sub==="record")   return renderRecord();
  if(S.sub==="paper")    return renderPaper();

  const todayN=people(todayDone()), all=people(doneTickets());
  const waiting=S.tickets.filter(t=>t.status==="waiting").length;
  const ph=perHour(), fc=forecast();
  const goal=S.settings.goal_people||300;
  const pct=Math.min(100,Math.round(todayN/goal*100));
  const left=prizeLeft(), total=prizeTotal(), given=prizeGiven();
  const out=prizeOutAt();

  // 要確認
  const alerts=[];
  for(const b of S.booths){
    const turn=(b.avg_minutes||6)*60;
    for(const t of insideTickets(b.id)){
      if(elapsedSec(t.inside_at)>turn*2)
        alerts.push({k:"bad",t:`${b.name} ${elapsed(t.inside_at)}経過`,
          p:"終了の押し忘れの可能性。継続中なら操作不要。",id:t.id});
    }
    const w=waitingTickets(b.id).length;
    if(w>=3 && reserved(b.id)<(b.capacity||4) && !calledTickets(b.id).length && !b.paused)
      alerts.push({k:"wn",t:`${b.name} ${w}組待ち`,p:"空席あり。受付に呼び出しを依頼。"});
  }
  const cl=parseHM(S.settings.close_at);
  if(cl){ const m=(cl.getTime()-Date.now())/60000;
    if(m>0&&m<=30) alerts.push({k:"wn",t:"閉場30分前",p:"「まもなく受付を終了します」を出す頃です。"}); }

  let h=`<div class="staff">
    <div class="shd"><span>統括</span><button class="sw" onclick="setRole(null)">担当を変更</button></div>
    <div class="dsec">現在の状況</div>
    <div class="kpr">
      <div><div class="a">${todayN}</div><div class="b2">今日</div></div>
      <div><div class="a">${waiting}</div><div class="b2">待ち組</div></div>
      <div><div class="a">${ph===null?"—":ph}</div><div class="b2">人/時</div></div>
    </div>
    ${all!==todayN?`<div class="total2">2日合計 <b>${all}人</b>（${today()}日目）</div>`:`<div class="total2">${today()}日目</div>`}
    <div class="goal">
      <div class="t">目標 ${goal}人 ・ ${pct}%</div>
      <div class="bar2"><i style="width:${pct}%"></i></div>
      <div class="f">${ph===null?"計測中（開場から30分は出しません）"
        :fc===null?"閉場時刻を設定すると見込みが出ます"
        :`このペースなら閉場までに${fc}人。${fc>=goal?"目標に届きそうです":"目標にとどきません"}`}</div>
    </div>

    <div class="dsec">各卓の状況</div>`;
  for(const b of S.booths){
    const ins=insideTickets(b.id), w=waitingTickets(b.id).length;
    const turn=(b.avg_minutes||6)*60;
    const hot=ins.some(t=>elapsedSec(t.inside_at)>turn*2);
    if(ins.length){
      h+=`<div class="tbr${hot?" hot":""}"><b>${esc(b.name)}</b>
        <div class="v">${ins.map(t=>pad(t.number)).join(" ")} 使用中 ・ <em>${elapsed(ins[0].inside_at)}</em> ・ ${w}組待ち</div></div>`;
    } else {
      h+=`<div class="tbr idle"><b>${esc(b.name)}</b>
        <div class="v">${b.paused?"受付を止めています":calledTickets(b.id).length?`${pad(calledTickets(b.id)[0].number)}を呼び出し中`:"空いています"} ・ ${w}組待ち</div></div>`;
    }
  }

  h+=`<div class="dsec">要確認 ${alerts.length?`<u>${alerts.length}</u>`:""}</div>`;
  if(!alerts.length) h+=`<div class="cfgmore">いまのところ問題ありません</div>`;
  for(const a of alerts){
    h+=`<div class="alr ${a.k}"><b>${a.k==="bad"?"⏱":"▲"} ${esc(a.t)}</b><p>${esc(a.p)}</p>
      ${a.id?`<button onclick="finish([${a.id}])">強制終了</button>`:""}</div>`;
  }

  h+=`<div class="dsec">景品</div>
    <div class="gft">
      <div class="r2"><i>用意</i> ${total}個　<i>渡した</i> ${given}個</div>
      <div class="bar3"><i style="width:${total?Math.max(0,Math.round(left/total*100)):0}%"></i></div>
      <div class="r2"><i>残り</i> ${left} / ${total}</div>
      ${out?`<div class="fo">このペースで <b style="color:var(--red)">${out}</b> に在庫切れ</div>`:""}
    </div>
    <button class="op1" style="margin-top:7px" onclick="refill()"><b>＋ 景品を補充する</b><span>追加で出した数を入れる</span></button>

    <div class="dsec">操作</div>
    <button class="op1" onclick="sub('announce')"><b>一斉アナウンス</b><span>客側の画面に表示</span></button>
    <button class="op1" onclick="sub('record')"><b>記録を見る</b><span>時間帯や卓ごとの人数</span></button>
    <button class="op1" onclick="sub('paper')"><b>紙モード</b><span>アプリ停止時に番号一覧を表示</span></button>
    <button class="op1" onclick="sub('settings')"><b>設定</b><span>席数・営業時間・片づけ</span></button>
  </div>`;
  return h;
}

}

/* アナウンス */
function renderAnnounce(){
  const cur=S.settings.announce;
  let h=`<div class="staff">
    <div class="shd"><span>お知らせ</span><button class="sw" onclick="sub(null)">閉じる</button></div>
    <div class="sjob">一斉アナウンス</div><div class="ssub">客側の画面に表示されます</div>`;
  if(announceText(cur)) h+=`<div class="nowb"><div class="nk">表示中</div><div class="nv">${esc(announceText(cur))}</div></div>`;
  h+=`<div class="dsec">出す内容を選ぶ</div>`;
  ANNOUNCES.forEach((t,i)=>{
    h+=`<button class="aopt${String(i)===String(cur)?" on":""}" onclick="setAnnounce(${i})">
      <span class="amk"></span><span class="atx">${esc(t)}</span></button>`;
  });
  h+=`<button class="kundo" onclick="setAnnounce(null)">お知らせを消す</button></div>`;
  return h;
}

/* 記録 */
function renderRecord(){
  const done=todayDone();
  const byHour={};
  done.forEach(t=>{ if(!t.done_at)return; const hh=new Date(t.done_at).getHours();
    byHour[hh]=(byHour[hh]||0)+(t.people||1); });
  const hours=Object.keys(byHour).map(Number).sort((a,b)=>a-b);
  const mx=Math.max(1,...hours.map(hh=>byHour[hh]));
  const byBooth=S.booths.map(b=>({name:b.name,n:people(done.filter(t=>t.booth===b.id))}))
    .sort((a,b)=>b.n-a.n);
  const bmx=Math.max(1,...byBooth.map(x=>x.n));
  // 待ち時間の平均（発券→入場）
  const waits=done.filter(t=>t.created_at&&t.inside_at)
    .map(t=>(new Date(t.inside_at)-new Date(t.created_at))/60000);
  const avgW=waits.length?Math.round(waits.reduce((a,b)=>a+b,0)/waits.length):null;
  const maxW=waits.length?Math.round(Math.max(...waits)):null;
  const plays=done.filter(t=>t.inside_at&&t.done_at)
    .map(t=>(new Date(t.done_at)-new Date(t.inside_at))/60000);
  const avgP=plays.length?(plays.reduce((a,b)=>a+b,0)/plays.length):null;

  let h=`<div class="staff">
    <div class="shd"><span>記録</span><button class="sw" onclick="sub(null)">閉じる</button></div>
    <div class="sjob">記録</div><div class="ssub">${esc(S.settings.open_at||"")}〜 いままで</div>
    <div class="dsec">時間帯ごとの人数</div>`;
  if(!hours.length) h+=`<div class="cfgmore">まだ記録がありません</div>`;
  else{ h+=`<div class="chart2">`;
    hours.forEach(hh=>{ h+=`<div class="cb2"><span class="cl">${hh}時</span>
      <span class="cg"><i style="width:${Math.round(byHour[hh]/mx*100)}%"></i></span>
      <span class="cn3">${byHour[hh]}</span></div>`; });
    h+=`</div>`; }

  h+=`<div class="dsec">卓ごとの人数</div><div class="gft">`;
  byBooth.forEach(x=>{ h+=`<div class="rk2"><div class="rt"><span>${esc(x.name)}</span><b>${x.n}人</b></div>
    <div class="rg2"><i style="width:${Math.round(x.n/bmx*100)}%"></i></div></div>`; });
  h+=`</div>

    <div class="dsec">全体の数字</div>
    <div class="stat2"><span>平均の待ち時間</span><b>${avgW===null?"—":avgW+"分"}</b></div>
    <div class="stat2"><span>いちばん待った人</span><b>${maxW===null?"—":maxW+"分"}</b></div>
    <div class="stat2"><span>1回あたりの平均</span><b>${avgP===null?"—":Math.floor(avgP)+"分"+String(Math.round(avgP%1*60)).padStart(2,"0")+"秒"}</b></div>
    <div class="stat2"><span>渡した景品</span><b>${prizeGiven()}個</b></div>
    <div class="stat2"><span>口コミの数</span><b>${S.reviews.length}件</b></div>
  </div>`;
  return h;
}

/* 紙モード */
function renderPaper(){
  const now=new Date();
  let h=`<div class="staff">
    <div class="shd"><span>紙モード</span><button class="sw" onclick="sub(null)">閉じる</button></div>
    <div class="paperm">
      <div class="hh"><span>いまの待ち番号</span><span>${now.getHours()}:${String(now.getMinutes()).padStart(2,"0")}</span></div>`;
  for(const b of S.booths){
    const w=waitingTickets(b.id);
    h+=`<div class="pl"><b>${esc(b.name)}</b><span>${w.length?
      `${pad(w[0].number)} <s>${w.slice(1,4).map(t=>pad(t.number)).join(" ")}</s>`:`<s>なし</s>`}</span></div>`;
  }
  h+=`</div>
    <div class="cfgmore">この画面のスクリーンショットを撮って、ボードに書き写してください。次の番号から手書きで続けられます。</div>
  </div>`;
  return h;
}

/* ---------- 統括の操作 ---------- */
function sub(v){ set({sub:v}) }
async function applyPreset(kind){
  if(S.busy)return;
  const conf = kind==="honban"
    ? {babanuki:[4,6],shinkei:[4,6],highandlow:[1,6],chinchiro:[5,6]}
    : {babanuki:[2,2],shinkei:[2,2],highandlow:[2,2],chinchiro:[2,2]};
  set({busy:true});
  try{
    for(const b of S.booths){
      const c=conf[b.id]||[4,6];
      await db.upBooth(b.id,{capacity:c[0],avg_minutes:c[1],paused:false});
    }
    await refresh(); toast(kind==="honban"?"本番の設定にしました":"リハーサルの設定にしました");
  }catch(e){ toast("できませんでした") }
  S.busy=false; render();
}
async function shiftBooth(id,key,d){
  if(S.busy)return;
  const b=S.booths.find(x=>x.id===id); if(!b)return;
  const v=Math.max(1,(b[key]||1)+d);
  set({busy:true});
  try{ await db.upBooth(id,{[key]:v}); await refresh(); }catch(e){ toast("できませんでした") }
  S.busy=false; render();
}
async function togglePause(id){
  if(S.busy)return;
  const b=S.booths.find(x=>x.id===id); if(!b)return;
  set({busy:true});
  try{ await db.upBooth(id,{paused:!b.paused}); await refresh(); }catch(e){ toast("できませんでした") }
  S.busy=false; render();
}
async function stopAll(){
  if(!confirm("すべての卓の受付を止めますか？"))return;
  set({busy:true});
  try{ for(const b of S.booths) await db.upBooth(b.id,{paused:true});
    await refresh(); toast("すべて止めました"); }catch(e){ toast("できませんでした") }
  S.busy=false; render();
}
async function shiftTime(key,min){
  const cur=S.settings[key]||"10:00";
  const m=cur.match(/^(\d{1,2}):(\d{2})$/); if(!m)return;
  let t=(+m[1])*60+(+m[2])+min; t=Math.max(0,Math.min(23*60+30,t));
  const v=`${String(Math.floor(t/60)).padStart(2,"0")}:${String(t%60).padStart(2,"0")}`;
  if(key==="close_at"){ const o=S.settings.open_at||"10:00";
    if(v<=o){ toast("閉場は開場より後にしてください"); return } }
  if(key==="open_at"){ const c=S.settings.close_at||"16:00";
    if(v>=c){ toast("開場は閉場より前にしてください"); return } }
  set({busy:true});
  try{ await db.upSettings({[key]:v}); await refresh(); }catch(e){ toast("できませんでした") }
  S.busy=false; render();
}
async function setDay(n){
  if(S.busy)return;
  if(!confirm(`${n}日目に切り替えますか？\n（この後の記録は${n}日目として集計されます）`))return;
  set({busy:true});
  try{ await db.upSettings({day:n}); await refresh(); toast(n+"日目にしました"); }
  catch(e){ toast("できませんでした") }
  S.busy=false; render();
}
async function shiftNum(key,d){
  const v=Math.max(1,(S.settings[key]||0)+d);
  set({busy:true});
  try{ await db.upSettings({[key]:v}); await refresh(); }catch(e){ toast("できませんでした") }
  S.busy=false; render();
}
async function setAnnounce(i){
  set({busy:true});
  try{ await db.upSettings({announce:i===null?null:String(i),
        announce_at:i===null?null:new Date().toISOString()});
    await refresh(); toast(i===null?"お知らせを消しました":"表示しました"); }
  catch(e){ toast("できませんでした") }
  S.busy=false; render();
}
async function setPrize(){
  const v=prompt("用意した景品の数を入れてください","100");
  if(!v)return; const n=parseInt(v,10);
  if(!(n>0)){toast("1以上の数を入れてください");return}
  if(!confirm(`今の景品の記録を消して、用意${n}個から始めますか？`))return;
  set({busy:true});
  try{ await db.delAllPrize(); await db.addPrize(n,"prepare",today());
    await db.upSettings({prize_prepared:n}); await refresh(); toast("設定しました"); }
  catch(e){ toast("できませんでした") }
  S.busy=false; render();
}
async function resetWaiting(){
  if(!confirm("待っている整理券をすべて消しますか？\n（遊び終わった記録と口コミは残ります）"))return;
  set({busy:true});
  try{ await db.delWaiting();
    for(const t of S.tickets.filter(x=>x.status==="called"||x.status==="arrived"))
      await db.upTicket(t.id,{status:"waiting",called_at:null,arrived_at:null});
    S.mine=[]; LS.set("mine2",[]);
    await refresh(); toast("整理券を消しました"); }
  catch(e){ toast("できませんでした") }
  S.busy=false; render();
}
async function delOneReview(){
  if(!S.reviews.length){toast("口コミがありません");return}
  const list=S.reviews.slice(0,10).map((r,i)=>`${i+1}. ★${r.rating} ${r.comment||"(コメントなし)"}`).join("\n");
  const v=prompt("消す番号を入れてください\n\n"+list);
  if(!v)return; const n=parseInt(v,10);
  const r=S.reviews[n-1]; if(!r){toast("その番号はありません");return}
  set({busy:true});
  try{ await db.delReview(r.id); await refresh(); toast("消しました"); }
  catch(e){ toast("できませんでした") }
  S.busy=false; render();
}
async function hideReviews(){
  if(!confirm("すべての口コミを隠しますか？\n（消えるのは表示だけで、記録は残ります）"))return;
  set({busy:true});
  try{ await db.hideAllReviews(); await refresh(); toast("隠しました"); }
  catch(e){ toast("できませんでした") }
  S.busy=false; render();
}
async function resetAll(){
  if(!confirm("すべてのデータを消します。よろしいですか？"))return;
  if(!confirm("本当に消しますか？\n整理券・口コミ・景品の記録・お知らせがすべて消えます。"))return;
  set({busy:true});
  try{
    await db.delAllTickets(); await db.delAllReviews(); await db.delAllPrize();
    await db.upSettings({announce:null,announce_at:null});
    for(const b of S.booths) await db.upBooth(b.id,{paused:false});
    S.mine=[]; S.reviewed=[]; LS.set("mine2",[]); LS.set("reviewed2",[]);
    await refresh(); toast("初期化しました");
  }catch(e){ toast("できませんでした") }
  S.busy=false; render();
}

/* ---------- 起動 ---------- */
refresh();
let pollMs=10000, pollTimer=null;
function startPoll(){
  if(pollTimer)clearInterval(pollTimer);
  pollTimer=setInterval(()=>{
    if(document.hidden)return;              // 画面が見えていないときは通信しない
    if(S.busy||S.pickBooth)return;
    refresh();
  },pollMs);
}
startPoll();
document.addEventListener("visibilitychange",()=>{ if(!document.hidden) refresh(); });
// 切れているときは間隔を空ける（つながったら戻す）
setInterval(()=>{
  const want=S.offline?30000:(S.view==="staff"?8000:12000);
  if(want!==pollMs){ pollMs=want; startPoll(); }
},5000);
setInterval(()=>{ if(S.view==="staff"&&S.authed&&S.role){ S.now=Date.now(); render(); } },1000);
